version: '3.8'

# Local full-stack: frontend (nginx) -> api (FastAPI) -> postgres + qdrant + redis.
# Local development only; prefer the root compose.yaml for the hardened single-host deployment.
# Create a .env beside this file with POSTGRES_PASSWORD and SECRET_KEY; do not use demo defaults
# on a networked host. Services are bound to loopback so infrastructure ports are not internet-facing.
# Then: `docker compose up --build`.

services:
  # HomzDoctor API
  api:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    environment:
      # asyncpg driver + service hostname (config.normalize_database_url also
      # accepts a plain postgresql:// URL and rewrites it).
      # This Compose stack is an isolated local/demo environment; cloud images default to production.
      - ENVIRONMENT=local
      - DEBUG=false
      - SEED_DEMO_DATA=${SEED_DEMO_DATA:-false}
- DATABASE_URL=postgresql+asyncpg://homzdoctor:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/homzdoctor
      - DATABASE_SSL=off
      - UPLOAD_DIR=/app/uploads
      - MAX_FILE_SIZE=25165824
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=homzdoctor_knowledge
      - EMBEDDING_MODEL=sentence-transformers/all-MiniLM-L6-v2
      - EMBEDDING_DIM=384
      # AI models (Hugging Face Inference API). Set HF_TOKEN in your shell/.env.
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_MODEL=${HF_MODEL:-meta-llama/Llama-3.1-8B-Instruct}
      - HF_VLM_MODEL=${HF_VLM_MODEL:-Qwen/Qwen2.5-VL-7B-Instruct}
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
    volumes:
      - ./uploads:/app/uploads
    networks:
      - homzdoctor

  # React Frontend (nginx proxies /api -> api:8000)
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    ports:
      - "3000:8080"
    environment:
      - BACKEND_HOST=api
      - BACKEND_PORT=8000
    depends_on:
      - api
    networks:
      - homzdoctor

  # PostgreSQL Database (persistent volume)
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: homzdoctor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: homzdoctor
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - homzdoctor

  # Qdrant Vector DB (RAG store)
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"  # REST/gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - homzdoctor

  # Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    networks:
      - homzdoctor

volumes:
  postgres_data:
  qdrant_data:

networks:
  homzdoctor:
    driver: bridge
