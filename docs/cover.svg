<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a1622"/>
      <stop offset="0.55" stop-color="#0b1f25"/>
      <stop offset="1" stop-color="#06141a"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e2a30" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0a1d22" stop-opacity="0.7"/>
    </linearGradient>
    <radialGradient id="glowTeal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#14b8a6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowEmerald" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="cardshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="30" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Ambient glows -->
  <circle cx="1300" cy="180" r="380" fill="url(#glowTeal)" filter="url(#soft)"/>
  <circle cx="220" cy="820" r="340" fill="url(#glowEmerald)" filter="url(#soft)"/>

  <!-- Subtle dot grid -->
  <g fill="#1c3a42" opacity="0.5">
    <g>
      <!-- generated grid of dots -->
      <g>
        <circle cx="80"  cy="120" r="2"/><circle cx="160" cy="120" r="2"/><circle cx="240" cy="120" r="2"/><circle cx="320" cy="120" r="2"/><circle cx="400" cy="120" r="2"/>
        <circle cx="80"  cy="200" r="2"/><circle cx="160" cy="200" r="2"/><circle cx="240" cy="200" r="2"/><circle cx="320" cy="200" r="2"/><circle cx="400" cy="200" r="2"/>
        <circle cx="80"  cy="280" r="2"/><circle cx="160" cy="280" r="2"/><circle cx="240" cy="280" r="2"/><circle cx="320" cy="280" r="2"/>
      </g>
    </g>
  </g>

  <!-- ===== Brand lockup ===== -->
  <g transform="translate(90,74)">
    <rect width="68" height="68" rx="18" fill="url(#brand)"/>
    <!-- stethoscope glyph -->
    <g transform="translate(16,15)" stroke="#06251f" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 2 v9 a8 8 0 0 0 16 0 v-9"/>
      <path d="M5 2 h4 M17 2 h4"/>
      <path d="M13 27 v-8" />
      <circle cx="13" cy="32" r="5" fill="#06251f" stroke="none"/>
      <circle cx="13" cy="32" r="2.4" fill="#2dd4bf" stroke="none"/>
    </g>
    <text x="86" y="30" font-size="30" font-weight="700" fill="#ffffff">Homz<tspan fill="#2dd4bf">Doctor</tspan></text>
    <text x="86" y="56" font-size="16" letter-spacing="3" fill="#7fd4c8">AI HEALTHCARE PLATFORM</text>
  </g>

  <!-- ===== Headline ===== -->
  <g transform="translate(90,300)">
    <text font-size="82" font-weight="800" fill="#ffffff" letter-spacing="-1">
      <tspan x="0" y="0">Intelligent</tspan>
      <tspan x="0" y="96" fill="url(#brand)">Healthcare Copilot</tspan>
    </text>
    <text font-size="27" fill="#9fb6bd" letter-spacing="0.2">
      <tspan x="2" y="168">From scan to care — LVLM imaging diagnosis, doctor-reviewed,</tspan>
      <tspan x="2" y="206">to pharmacy fulfilment &amp; adherence. Not a final decision-maker.</tspan>
    </text>
  </g>

  <!-- ===== Feature pills ===== -->
  <g transform="translate(90,706)" font-size="18" font-weight="600">
    <g>
      <rect width="186" height="46" rx="23" fill="#11312f" stroke="#2dd4bf" stroke-opacity="0.4"/>
      <circle cx="26" cy="23" r="5" fill="#2dd4bf"/>
      <text x="44" y="29" fill="#cdeee8">LVLM Imaging</text>
    </g>
    <g transform="translate(200,0)">
      <rect width="206" height="46" rx="23" fill="#11312f" stroke="#2dd4bf" stroke-opacity="0.4"/>
      <circle cx="26" cy="23" r="5" fill="#34d399"/>
      <text x="44" y="29" fill="#cdeee8">Doctor-in-the-Loop</text>
    </g>
    <g transform="translate(420,0)">
      <rect width="150" height="46" rx="23" fill="#11312f" stroke="#2dd4bf" stroke-opacity="0.4"/>
      <circle cx="26" cy="23" r="5" fill="#5eead4"/>
      <text x="44" y="29" fill="#cdeee8">Pharmacy</text>
    </g>
    <g transform="translate(584,0)">
      <rect width="160" height="46" rx="23" fill="#11312f" stroke="#2dd4bf" stroke-opacity="0.4"/>
      <circle cx="26" cy="23" r="5" fill="#6ee7b7"/>
      <text x="44" y="29" fill="#cdeee8">Adherence</text>
    </g>
  </g>

  <!-- ===== Right illustration: diagnostic console ===== -->
  <g transform="translate(940,196)" filter="url(#cardshadow)">
    <rect width="560" height="468" rx="30" fill="url(#glass)" stroke="#1f4a50" stroke-width="1.5"/>

    <!-- header -->
    <circle cx="40" cy="44" r="6" fill="#34d399"/>
    <text x="58" y="50" font-size="17" letter-spacing="2.5" fill="#7fd4c8" font-weight="600">AI DIAGNOSIS</text>
    <text x="500" y="50" font-size="15" fill="#5b7a80" text-anchor="end">chest · x-ray</text>

    <!-- scan panel -->
    <rect x="36" y="78" width="300" height="330" rx="16" fill="#04141a"/>
    <!-- ribcage -->
    <g transform="translate(186,243)" stroke="#2dd4bf" fill="none" stroke-linecap="round" opacity="0.9">
      <rect x="-7" y="-120" width="14" height="240" rx="7" fill="#1f6e66" stroke="none" opacity="0.6"/>
      <g stroke-width="3" opacity="0.85">
        <path d="M-6 -96 q -70 18 -86 70"/>
        <path d="M6 -96 q 70 18 86 70"/>
        <path d="M-6 -60 q -82 20 -98 80"/>
        <path d="M6 -60 q 82 20 98 80"/>
        <path d="M-6 -24 q -88 24 -100 92"/>
        <path d="M6 -24 q 88 24 100 92"/>
        <path d="M-6 12 q -84 26 -92 96"/>
        <path d="M6 12 q 84 26 92 96"/>
      </g>
    </g>
    <!-- ROI crosshair -->
    <g stroke="#fbbf24" stroke-width="2" fill="none">
      <rect x="150" y="150" width="92" height="92" rx="8" stroke-dasharray="6 6"/>
    </g>
    <text x="150" y="142" font-size="14" fill="#fbbf24">ROI</text>

    <!-- findings list -->
    <g transform="translate(366,92)">
      <text font-size="14" fill="#7fd4c8" letter-spacing="1.5" y="6">FINDINGS</text>
      <g fill="#0e2a30">
        <rect x="0" y="22" width="158" height="14" rx="7"/>
        <rect x="0" y="48" width="130" height="14" rx="7"/>
        <rect x="0" y="74" width="150" height="14" rx="7"/>
        <rect x="0" y="100" width="110" height="14" rx="7"/>
      </g>
      <g fill="#23545a">
        <rect x="0" y="22" width="96" height="14" rx="7"/>
        <rect x="0" y="48" width="70" height="14" rx="7"/>
        <rect x="0" y="74" width="112" height="14" rx="7"/>
      </g>

      <!-- confidence ring -->
      <g transform="translate(78,210)">
        <circle r="52" fill="none" stroke="#123338" stroke-width="11"/>
        <circle r="52" fill="none" stroke="url(#brand)" stroke-width="11" stroke-linecap="round"
                stroke-dasharray="326.7" stroke-dashoffset="29.4" transform="rotate(-90)"/>
        <text y="-2" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">91%</text>
        <text y="22" font-size="13" fill="#7fd4c8" text-anchor="middle">confidence</text>
      </g>
    </g>

    <!-- doctor-review chip -->
    <g transform="translate(36,424)">
      <rect width="488" height="30" rx="15" fill="#11312f"/>
      <circle cx="22" cy="15" r="5" fill="#fbbf24"/>
      <text x="38" y="20" font-size="14" fill="#cdeee8">Awaiting doctor review — clinician approval required</text>
    </g>
  </g>

  <!-- neural nodes accent -->
  <g stroke="#2dd4bf" stroke-opacity="0.35" fill="#2dd4bf">
    <line x1="905" y1="300" x2="945" y2="330" stroke-width="1.5"/>
    <line x1="905" y1="300" x2="938" y2="430" stroke-width="1.5"/>
    <line x1="905" y1="300" x2="930" y2="540" stroke-width="1.5"/>
    <circle cx="905" cy="300" r="5"/>
    <circle cx="905" cy="300" r="11" fill="none" stroke-opacity="0.4"/>
  </g>

  <!-- ===== ECG pulse line ===== -->
  <path d="M0 812 H560 l18 0 l14 -46 l20 92 l16 -150 l18 150 l14 -46 l16 0 H1600"
        fill="none" stroke="#1f6e66" stroke-width="2.5" opacity="0.55"/>

  <!-- ===== Credits ===== -->
  <g transform="translate(90,832)">
    <text font-size="14" letter-spacing="3" fill="#5b7a80">CREATED BY</text>
    <text y="34" font-size="32" font-weight="700" fill="#ffffff">
      Haroon Sajid
      <tspan fill="#2dd4bf" dx="14" dy="0">•</tspan>
      <tspan fill="#ffffff" dx="14">Mina Gayid</tspan>
    </text>
  </g>

  <!-- corner version tag -->
  <g transform="translate(1402,832)">
    <rect width="108" height="44" rx="22" fill="#11312f" stroke="#2dd4bf" stroke-opacity="0.35"/>
    <text x="54" y="28" font-size="16" font-weight="600" fill="#cdeee8" text-anchor="middle">v0.1</text>
  </g>
</svg>
